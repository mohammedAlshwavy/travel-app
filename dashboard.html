<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلاتي PRO - إدارة الحجوزات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-plane-departure" style="color: var(--primary);"></i>
                <span>رحلاتي</span> <span class="brand-tag">PRO</span>
            </div>

            <div class="nav-links">
                <a href="index.html"><i class="fa-solid fa-plane"></i> الطيران</a>
                <a href="hotel-details.html"><i class="fa-solid fa-hotel"></i> الفنادق</a>
                <a href="car-rental.html"><i class="fa-solid fa-car"></i> تأجير السيارات</a>
                <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-line"></i> لوحة التحكم</a>
            </div>

            <div class="header-actions">
                <button class="icon-btn" id="themeToggleBtn"><i class="fa-solid fa-sun" id="themeIcon"></i></button>
                <button class="icon-btn mobile-only" id="mobileMenuBtn"><i class="fa-solid fa-bars"></i></button>
            </div>
        </nav>

        <header style="margin-bottom: 25px;">
            <h1 style="font-size: 1.8rem; font-weight: 800;">
                <i class="fa-solid fa-sliders" style="color: var(--primary);"></i> لوحة التحكم وإدارة الحجوزات
            </h1>
            <p style="color: var(--text-muted);">يمكنك تعديل المواعيد، طباعة التذاكر، أو إلغاء الحجز ديناميكياً</p>
        </header>

        <!-- Stats Overview Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card-box" style="text-align: center;">
                <i class="fa-solid fa-plane" style="font-size: 2rem; color: var(--primary); margin-bottom: 8px;"></i>
                <div style="font-size: 1.8rem; font-weight: 800;" id="stat-flights">0</div>
                <small style="color: var(--text-muted);">حجوزات طيران</small>
            </div>

            <div class="card-box" style="text-align: center;">
                <i class="fa-solid fa-hotel" style="font-size: 2rem; color: var(--accent); margin-bottom: 8px;"></i>
                <div style="font-size: 1.8rem; font-weight: 800;" id="stat-hotels">0</div>
                <small style="color: var(--text-muted);">حجوزات فنادق</small>
            </div>

            <div class="card-box" style="text-align: center;">
                <i class="fa-solid fa-car" style="font-size: 2rem; color: var(--success); margin-bottom: 8px;"></i>
                <div style="font-size: 1.8rem; font-weight: 800;" id="stat-cars">0</div>
                <small style="color: var(--text-muted);">حجوزات سيارات</small>
            </div>
        </div>

        <!-- Bookings List Section -->
        <h2 style="margin-bottom: 15px; font-size: 1.3rem;"><i class="fa-solid fa-list-check"></i> قائمة حجوزاتك النشطة</h2>
        
        <div id="dynamic-booking-list">
            <!-- Dynamic Injection via js/main.js -->
        </div>
    </div>

    <!-- Edit Booking Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square" style="color: var(--primary);"></i> تعديل تفاصيل الحجز</h3>
                <button class="close-modal-btn" onclick="closeEditModal()">&times;</button>
            </div>

            <form onsubmit="saveBookingEdit(event)">
                <input type="hidden" id="edit-booking-id">

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>عنوان الحجز / الخدمة</label>
                    <input type="text" id="edit-booking-title" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>المواصفات والبيانات</label>
                    <input type="text" id="edit-booking-info" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>تاريخ الحجز / السفر</label>
                    <input type="text" id="edit-booking-date" required>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="action-btn secondary" onclick="closeEditModal()">إلغاء</button>
                    <button type="submit" class="action-btn primary"><i class="fa-solid fa-floppy-disk"></i> حفظ التغيرات</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
